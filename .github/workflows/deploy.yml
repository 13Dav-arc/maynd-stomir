name: Deploy Maynd Stomir Platform

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/mayndstomir
            git pull origin main
            sed -i "s/const CACHE_NAME = .*/const CACHE_NAME = 'maynd-stomir-${{ github.sha }}';/g" service-worker.js
            sudo chown -R www-data:www-data /var/www/mayndstomir